<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Janosch Rajewski – Videograf & Editor in Berlin</title>
<meta name="description" id="metaDesc" content="Videograf, Editor und Fotograf aus Berlin. Musikvideos, Kurzfilme und Content – Dreh, Schnitt, Color Grading und Sound aus einer Hand.">
<meta property="og:type" content="website">
<meta property="og:title" content="Janosch Rajewski – Videograf & Editor in Berlin">
<meta property="og:description" content="Videograf, Editor und Fotograf aus Berlin. Musikvideos, Kurzfilme und Content.">
<meta property="og:image" content="/img/og-default.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0e1113">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" id="font-display" href="fonts/archivo.css">
<link rel="stylesheet" id="font-body" href="fonts/ibm-plex-sans.css">
<link rel="stylesheet" id="font-mono" href="fonts/ibm-plex-mono.css">
<style>
/* Alle Farben, Schriften und Maße kommen aus dem Editor (Design-Tab) und werden als Variablen gesetzt. */
:root{
  --bg:#0e1113; --panel:#151a1d; --line:#283034; --fg:#ebe7e0; --muted:#8f999d; --accent:#d6363d; --on-accent:#fff;
  --accent-soft:color-mix(in srgb,var(--accent) 72%,var(--fg));
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --hcase:uppercase; --hweight:800; --hstretch:68%; --hs:1; --radius:0px; --maxw:1240px; --base:16px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:var(--base);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--accent);color:var(--on-accent)}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.accent{color:var(--accent-soft)}
h1,h2,h3{font-family:var(--display);font-stretch:var(--hstretch);font-weight:var(--hweight);line-height:.95;margin:0;text-wrap:balance;text-transform:var(--hcase);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
h2{font-size:calc(clamp(40px,7vw,92px) * var(--hs))}
h2 .dot,h1 em,h2 em{color:var(--accent);font-style:normal}
p{margin:0}

/* Abschnitte */
.sec{background:var(--bg);color:var(--fg)}
.sec.divider{border-top:1px solid var(--line)}
.pad-s{padding-block:36px}
.pad-m{padding-block:clamp(64px,10vw,120px)}
.pad-l{padding-block:clamp(96px,14vw,180px)}
.bg-panel{--bg:var(--panel)}
.bg-accent{--bg:color-mix(in srgb,var(--accent) 14%,var(--base-bg,#0e1113))}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:48px}
.sec-head>p{max-width:46ch;color:var(--muted)}
.al-center .sec-head{flex-direction:column;align-items:center;text-align:center}
.al-center .center-able{text-align:center;margin-inline:auto}
.sec.is-hidden-preview{opacity:.35}

/* Navigation */
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:20px;text-transform:var(--hcase);letter-spacing:.02em;min-width:0}
.brand a{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);border:0;padding:0;cursor:pointer;position:relative;flex:none;transition:transform .2s}
.rec-dot::after{content:"";position:absolute;inset:-10px}
.rec-dot:hover{transform:scale(1.3)}
.nav nav{display:flex;gap:22px}
.nav nav a{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--muted);white-space:nowrap}
.nav nav a:hover{color:var(--fg)}
.nav nav a.cta-link{color:var(--accent-soft)}
@media (max-width:760px){.nav nav a:not(.cta-link){display:none}}

/* Buttons */
.btns{display:flex;gap:12px;flex-wrap:wrap}
.al-center .btns{justify-content:center}
.btn{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;border-radius:var(--radius);transition:border-color .2s,background .2s}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.1)}
.btn:not(.primary):hover{border-color:var(--fg)}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:3px 8px;border:1px solid var(--line);color:var(--fg);border-radius:calc(var(--radius) / 2)}

/* Startbereich */
.frame{position:relative;width:100%;max-width:100%;aspect-ratio:var(--ratio,2.39/1);background:#08090a;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius)}
@media (max-width:640px){.frame{aspect-ratio:4/5}}
.frame>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:40% 45%;transform:scale(1.04);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.12) translate(-1.5%,-1%)}}
.frame::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65) 100%),linear-gradient(180deg,rgba(0,0,0,.35),transparent 25%,transparent 70%,rgba(0,0,0,.45));pointer-events:none}
.frame canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;mix-blend-mode:overlay;opacity:.5;pointer-events:none}
.vf{position:absolute;inset:0;z-index:2;pointer-events:none;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:rgba(235,231,224,.88)}
.vf .c{position:absolute;width:28px;height:28px;border-color:rgba(235,231,224,.75);border-style:solid;border-width:0}
.vf .tl{top:16px;left:16px;border-top-width:1.5px;border-left-width:1.5px}
.vf .tr{top:16px;right:16px;border-top-width:1.5px;border-right-width:1.5px}
.vf .bl{bottom:16px;left:16px;border-bottom-width:1.5px;border-left-width:1.5px}
.vf .br{bottom:16px;right:16px;border-bottom-width:1.5px;border-right-width:1.5px}
.vf .top,.vf .bot{position:absolute;left:56px;right:56px;display:flex;justify-content:space-between;gap:12px}
.vf .top{top:22px}.vf .bot{bottom:22px}
.rec{display:inline-flex;align-items:center;gap:8px;color:#fff}
.rec i{width:9px;height:9px;border-radius:50%;background:var(--accent);animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (max-width:520px){.vf .hide-s{display:none}.vf .top,.vf .bot{left:44px;right:44px}}
.play{position:absolute;z-index:3;left:50%;bottom:16%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:12px 22px 12px 12px;background:rgba(14,17,19,.55);border:1px solid rgba(235,231,224,.3);color:#fff;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;backdrop-filter:blur(6px);cursor:pointer;white-space:nowrap;border-radius:var(--radius)}
.play b{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.play b::after{content:"";border-left:11px solid var(--on-accent);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.play:hover{border-color:var(--accent)}
.hero-text{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:end;margin-top:40px}
.al-center .hero-text{grid-template-columns:1fr;text-align:center;justify-items:center}
@media (max-width:860px){.hero-text{grid-template-columns:1fr;gap:24px}}
.hero h1{font-size:calc(clamp(52px,11.5vw,168px) * var(--hs));font-stretch:calc(var(--hstretch) - 6%)}
.hero .lede{font-size:1.125em;max-width:46ch;margin-bottom:20px}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}
.al-center .facts{justify-content:center}

/* Filme */
.films{display:flex;flex-direction:column;gap:clamp(56px,8vw,96px)}
.film{display:grid;grid-template-columns:1.55fr 1fr;gap:clamp(24px,4vw,56px);align-items:center}
.films.alternating .film:nth-child(even){grid-template-columns:1fr 1.55fr}
.films.alternating .film:nth-child(even) .still{order:2}
.films.grid,.films.grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:48px 32px}
.films.grid3{grid-template-columns:repeat(3,1fr)}
.films.grid .film,.films.grid3 .film,.films.stack .film{grid-template-columns:1fr;align-items:start;gap:20px}
.films.grid h3,.films.grid3 h3{font-size:calc(clamp(28px,3vw,40px) * var(--hs))}
@media (max-width:980px){.films.grid3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){.film,.films.alternating .film:nth-child(even){grid-template-columns:1fr}.films.alternating .film:nth-child(even) .still{order:0}.films.grid,.films.grid3{grid-template-columns:1fr}}
.still{position:relative;aspect-ratio:16/9;max-width:100%;width:100%;overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius)}
.still img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .4s}
.still.playable{cursor:pointer}
.still.playable:hover img{transform:scale(1.04);filter:brightness(.8)}
.still-btn{position:absolute;inset:0;z-index:2;background:none;border:0;cursor:pointer;width:100%}
.still .pb{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--accent);display:grid;place-items:center;transition:transform .3s,box-shadow .3s}
.still .pb::after{content:"";border-left:18px solid var(--on-accent);border-top:11px solid transparent;border-bottom:11px solid transparent;margin-left:5px}
.still.playable:hover .pb{transform:scale(1.1);box-shadow:0 0 0 12px color-mix(in srgb,var(--accent) 20%,transparent)}
.still .tc{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:rgba(235,231,224,.9);letter-spacing:.06em;text-shadow:0 1px 4px #000}
.still .fmt{position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:2px 6px;border:1px solid rgba(235,231,224,.4);color:#fff;background:rgba(0,0,0,.3)}
.still iframe,.still video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.still .noimg{position:absolute;inset:0;display:grid;place-items:center}
.film-info{display:flex;flex-direction:column;gap:14px;min-width:0}
.kicker{display:flex;gap:10px 18px;flex-wrap:wrap}
.film h3{font-size:calc(clamp(36px,5vw,64px) * var(--hs));font-stretch:calc(var(--hstretch) - 2%)}
.film h3 small{display:block;font-size:.45em;font-stretch:80%;font-weight:600;color:var(--muted);margin-top:8px;letter-spacing:.02em}
.film p{max-width:44ch}
.role{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.role .mono{color:var(--accent-soft);margin-right:4px}
.role .chip{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.crew{font-size:.875em;color:var(--muted)}
.yt-note{position:absolute;inset:0;z-index:3;background:rgba(10,12,13,.88);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;padding:clamp(16px,4vw,40px)}
.yt-note p{max-width:46ch;font-size:15px}

/* Einzelnes Video */
.vbox{position:relative;width:100%;max-width:100%;aspect-ratio:var(--ratio,16/9);margin-inline:auto;border:1px solid var(--line);background:var(--panel);overflow:hidden;border-radius:var(--radius)}
.vbox.portrait{max-width:420px}
.vbox.square{max-width:720px}
.vbox img{width:100%;height:100%;object-fit:cover}
.vbox .still{position:absolute;inset:0;border:0;aspect-ratio:auto}
.video-intro{max-width:60ch;color:var(--muted);margin-top:-24px;margin-bottom:32px}
.al-center .video-intro{margin-inline:auto;text-align:center}

/* Fotografie */
.series{display:flex;flex-direction:column;gap:64px}
.series-head{display:grid;grid-template-columns:auto 1fr;gap:12px 32px;align-items:baseline;margin-bottom:20px}
.al-center .series-head{grid-template-columns:1fr;text-align:center;justify-items:center}
@media (max-width:640px){.series-head{grid-template-columns:1fr}}
.series-head h3{font-size:calc(clamp(32px,5vw,56px) * var(--hs));font-stretch:calc(var(--hstretch) - 2%)}
.series-head p{color:var(--muted);max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:var(--gap,10px)}
@media (max-width:860px){.grid{grid-template-columns:repeat(2,1fr)}}
.ph{padding:0;border:0;background:var(--panel);aspect-ratio:var(--pr,4/5);max-width:100%;overflow:hidden;cursor:zoom-in;position:relative;border-radius:var(--radius);display:block;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.ph:hover img{transform:scale(1.05)}
.ph.wide{grid-column:span 2}
.grid.masonry{display:block;columns:var(--cols,4);column-gap:var(--gap,10px)}
@media (max-width:860px){.grid.masonry{columns:2}}
.grid.masonry .ph{aspect-ratio:auto;margin-bottom:var(--gap,10px);break-inside:avoid}
.grid.masonry .ph img{height:auto}

/* Text */
.text-block{max-width:68ch;display:flex;flex-direction:column;gap:18px}
.al-center .text-block{margin-inline:auto;text-align:center;align-items:center}
.text-block .body p+p{margin-top:1em}
.text-block.size-l .body{font-size:1.25em}
.text-block.size-xl .body{font-size:clamp(22px,2.6vw,32px);line-height:1.35}

/* Text mit Bild */
.ti{display:grid;grid-template-columns:1fr 1.3fr;gap:56px;align-items:start}
.ti.right{grid-template-columns:1.3fr 1fr}
.ti.right .ti-img{order:2}
@media (max-width:860px){.ti,.ti.right{grid-template-columns:1fr;gap:32px}.ti.right .ti-img{order:0}}
.ti-img{position:relative;aspect-ratio:var(--ir,4/5);max-width:100%;border:1px solid var(--line);overflow:hidden;background:var(--panel);border-radius:var(--radius)}
.ti-img img{width:100%;height:100%;object-fit:cover}
.ti-img.auto{aspect-ratio:auto}.ti-img.auto img{height:auto}
.ti-img .cap{position:absolute;left:12px;bottom:10px;color:#fff;text-shadow:0 1px 4px #000}
.ti-text{min-width:0}
.ti-text h2{margin:12px 0 28px}
.ti-text .body p{font-size:1.125em;max-width:58ch;margin-bottom:18px}
.kit{display:grid;grid-template-columns:auto 1fr;gap:10px 24px;margin:28px 0;padding-top:24px;border-top:1px solid var(--line)}
.kit dt{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.kit dd{margin:0}

/* Leistungen */
.services{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
@media (max-width:860px){.services{grid-template-columns:repeat(min(2,var(--cols,3)),1fr)}}
@media (max-width:560px){.services{grid-template-columns:1fr}}
.svc{padding:28px 24px 32px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px;min-width:0;transition:background .25s}
.svc:hover{background:var(--panel)}
.svc:hover h3{color:var(--accent)}
.svc h3{font-size:calc(34px * var(--hs));font-stretch:calc(var(--hstretch) + 2%);transition:color .25s}
.svc p{color:var(--muted);max-width:40ch}
.svc .spec{margin-top:auto;padding-top:14px;display:flex;flex-wrap:wrap;gap:6px}

/* Schritte */
.steps{display:grid;grid-template-columns:repeat(var(--n,5),1fr)}
@media (max-width:900px){.steps{grid-template-columns:1fr}}
.step{padding:24px 20px 28px 0;border-top:2px solid var(--line);position:relative;min-width:0}
.step::before{content:"";position:absolute;top:-2px;left:0;width:36px;height:2px;background:var(--accent)}
@media (max-width:900px){.step{padding:20px 0}}
.step .mono{color:var(--accent-soft)}
.step h3{font-size:calc(30px * var(--hs));font-stretch:calc(var(--hstretch) + 4%);margin:10px 0 8px}
.step p{color:var(--muted);font-size:.94em;max-width:34ch}

/* Zitat */
.quote{max-width:28ch;font-family:var(--display);font-stretch:calc(var(--hstretch) + 10%);font-weight:calc(var(--hweight) - 200);font-size:calc(clamp(30px,4.6vw,58px) * var(--hs));line-height:1.08;text-wrap:balance;margin:0}
.quote::before{content:"„";color:var(--accent)}
.quote::after{content:"“";color:var(--accent)}
.al-center .quote{margin-inline:auto;text-align:center}
.quote-by{margin-top:24px}
.al-center .quote-by{text-align:center}

/* Banner */
.cta{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.al-center .cta{align-items:center;text-align:center}
.cta h2{font-size:calc(clamp(40px,7vw,96px) * var(--hs))}
.cta p{max-width:52ch;font-size:1.125em}

/* Kunden */
.logos{display:flex;flex-wrap:wrap;gap:20px 48px;align-items:center}
.al-center .logos{justify-content:center}
.logos .lg{font-family:var(--display);font-stretch:calc(var(--hstretch) + 10%);font-weight:700;font-size:calc(28px * var(--hs));text-transform:var(--hcase);color:var(--muted);text-decoration:none;transition:color .2s}
.logos a.lg:hover{color:var(--fg)}
.logos img{max-height:44px;width:auto;filter:grayscale(1) brightness(1.6);opacity:.75;transition:opacity .2s,filter .2s}
.logos a:hover img{opacity:1;filter:none}
.logos-title{margin-bottom:28px}
.al-center .logos-title{text-align:center}

/* Kontakt */
.contact h2{font-size:calc(clamp(52px,11vw,150px) * var(--hs))}
.contact-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;margin-top:40px}
.al-center .contact-grid{grid-template-columns:1fr;justify-items:center;text-align:center}
@media (max-width:860px){.contact-grid{grid-template-columns:1fr}}
.mailbox{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:20px;border:1px solid var(--line);background:var(--panel);border-radius:var(--radius)}
.mailbox .addr{font-family:var(--display);font-stretch:85%;font-weight:600;font-size:clamp(20px,3vw,30px);user-select:all;overflow-wrap:anywhere;flex:1 1 100%;min-width:0}
.brief{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.brief li{display:flex;gap:12px;color:var(--muted);text-align:left}
.brief li::before{content:"●";color:var(--accent);font-size:9px;padding-top:6px}
.socials{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.al-center .socials{justify-content:center}

footer{border-top:1px solid var(--line);padding-block:28px}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{color:var(--fg)}

/* Lightbox + Login */
.lb{position:fixed;inset:0;z-index:50;background:rgba(6,7,8,.94);display:flex;align-items:center;justify-content:center;padding:max(56px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(56px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#ebe7e0}
.lb[hidden]{display:none}
.lb-inner{width:min(1200px,100%);display:flex;flex-direction:column;gap:12px}
.lb-media{position:relative;width:100%;max-height:78vh;display:flex;justify-content:center}
.lb-media img{max-height:78vh;width:auto;object-fit:contain}
.lb-media .video{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;background:#000;border:1px solid var(--line)}
.lb-media iframe,.lb-media video{width:100%;height:100%;border:0;display:block}
.lb-bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

.lb-nav{display:flex;gap:8px}.lb-all{margin-left:auto}@media (max-width:640px){.lb-all{order:3;margin-left:0;width:100%;justify-content:center}}
.lb .btn{color:#ebe7e0}
.login-card{width:min(400px,100%);background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:12px;border-radius:var(--radius)}

.login-card .err{min-height:1.4em;color:var(--accent-soft);font-size:14px}
.btn:disabled{opacity:.6;cursor:wait}
.empty-page{padding-block:120px;text-align:center}

/* Freier Bereich */
.free{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:28px 40px;align-items:start}
.free.va-center{align-items:center}.free.va-end{align-items:end}

.ta-center{text-align:center}.ta-right{text-align:right}
.ta-center .btns{justify-content:center}.ta-right .btns{justify-content:flex-end}
.ta-center .body,.ta-center .quote{margin-inline:auto}.ta-right .body{margin-left:auto}
.ta-center .stats{justify-content:center}.ta-right .stats{justify-content:flex-end}
.el h2.hs-s{font-size:calc(28px * var(--hs))}
.el h2.hs-m{font-size:calc(clamp(32px,4vw,52px) * var(--hs))}
.el h2.hs-l{font-size:calc(clamp(40px,7vw,92px) * var(--hs))}
.el h2.hs-xl{font-size:calc(clamp(56px,11vw,160px) * var(--hs))}
.el h3{font-size:calc(clamp(26px,3vw,40px) * var(--hs));margin-bottom:14px}
.el .body{max-width:68ch}
.el .body p+p{margin-top:1em}
.ts-s{font-size:.9em}.ts-l{font-size:1.25em}.ts-xl{font-size:clamp(22px,2.6vw,32px);line-height:1.35}
.body.muted{color:var(--muted)}
.btn.has-c.primary{background:var(--bc);border-color:var(--bc);color:var(--bt)}
.btn.has-c.bs-outline{border-color:var(--bc);color:var(--bc)}
.btn.has-c.bs-outline:hover{background:var(--bc);color:var(--bt)}
.btn.has-c.bs-text{color:var(--bc)}
.btn.bs-text{border-color:transparent;padding-inline:0;color:var(--accent-soft)}
.btn.bz-s{padding:9px 14px;font-size:11px}
.btn.bz-l{padding:18px 30px;font-size:14px}
.btn.bs-text{border-color:transparent;padding-inline:0;color:var(--accent-soft)}
.btn.bs-text::after{content:"→";transition:transform .2s}
.btn.bs-text:hover{border-color:transparent}
.btn.bs-text:hover::after{transform:translateX(4px)}
figure{margin:0}
figcaption{margin-top:10px}
.el-img{display:block;width:100%;padding:0;border:1px solid var(--line);background:var(--panel);overflow:hidden;border-radius:var(--radius);aspect-ratio:var(--r,16/9);position:relative}
.el-img img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.2,.7,.2,1),filter .5s}
.el-img.auto{aspect-ratio:auto}.el-img.auto img{height:auto}
.el-img.empty{display:grid;place-items:center;border-style:dashed}
.stats{display:flex;flex-wrap:wrap;gap:28px 64px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat b{font-family:var(--display);font-stretch:var(--hstretch);font-weight:var(--hweight);font-size:calc(clamp(48px,6.5vw,88px) * var(--hs));line-height:.9;color:var(--fg);font-variant-numeric:tabular-nums}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:n}
.elist li{position:relative;padding-left:30px}
.elist li::before{position:absolute;left:0;top:0;color:var(--accent);font-family:var(--mono)}
.ls-dot li::before{content:"●";font-size:9px;top:6px}
.ls-check li::before{content:"✓"}
.ls-dash li::before{content:"—"}
.ls-num li{counter-increment:n}.ls-num li::before{content:counter(n,decimal-leading-zero)}
.el-hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.el-hr.acc{border-top:2px solid var(--accent)}
.preview-mode [data-f]:hover,.preview-mode .brand:hover,.preview-mode footer .mono:hover{outline:1px dashed var(--accent);outline-offset:3px;cursor:pointer}
.preview-mode .el:hover{outline:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);outline-offset:6px}
.preview-mode .el.el-sel{outline:1px solid var(--accent);outline-offset:6px}

/* Foto-Effekte beim Drüberfahren */
.ph-zoom .el-img:hover img{transform:scale(1.04)}
.ph-none .ph:hover img,.ph-none .el-img:hover img{transform:none}
.ph-color .ph img,.ph-color .el-img img{filter:grayscale(1)}
.ph-color .ph:hover img,.ph-color .el-img:hover img{filter:none;transform:none}
.ph-lift .ph,.ph-lift .el-img{transition:transform .4s cubic-bezier(.2,.7,.2,1),box-shadow .4s}
.ph-lift .ph:hover,.ph-lift .el-img:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.ph-lift .ph:hover img{transform:none}
.ph-dim .grid:hover .ph img{filter:brightness(.45)}
.ph-dim .grid .ph:hover img{filter:none;transform:scale(1.03)}

/* Einblend-Animationen */
.a-t{transition:opacity var(--as,800ms) ease,transform var(--as,800ms) cubic-bezier(.2,.7,.2,1),filter var(--as,800ms) ease,clip-path var(--as,800ms) cubic-bezier(.7,0,.2,1);transition-delay:var(--d,0ms)}
[data-anim=fade] .a-t:not(.in){opacity:0}
[data-anim=up] .a-t:not(.in){opacity:0;transform:translateY(40px)}
[data-anim=down] .a-t:not(.in){opacity:0;transform:translateY(-40px)}
[data-anim=left] .a-t:not(.in){opacity:0;transform:translateX(-56px)}
[data-anim=right] .a-t:not(.in){opacity:0;transform:translateX(56px)}
[data-anim=zoom] .a-t:not(.in){opacity:0;transform:scale(.9)}
[data-anim=blur] .a-t:not(.in){opacity:0;filter:blur(16px)}
[data-anim=reveal] .a-t:not(.in){clip-path:inset(0 100% 0 0)}
[data-anim=reveal] .a-t.in{clip-path:inset(0 0 0 0)}

/* Zusätzliche Elemente in jedem Abschnitt */
.free.extras{margin-top:48px}
.free:empty{display:none}

/* Text-Animationen aus der Werkzeugleiste */
.ta-mark{background:linear-gradient(color-mix(in srgb,var(--accent) 45%,transparent),color-mix(in srgb,var(--accent) 45%,transparent)) no-repeat 0 88%/0% 38%;transition:background-size 1.1s cubic-bezier(.7,0,.2,1);padding:0 .06em}
.ta-mark.on{background-size:100% 38%}
.ta-ul{background:linear-gradient(currentColor,currentColor) no-repeat 0 100%/0% .08em;transition:background-size 1s cubic-bezier(.7,0,.2,1)}
.ta-ul.on{background-size:100% .08em}
.ta-glow{transition:opacity 1.2s ease,text-shadow 1.6s ease;opacity:.35}
.ta-glow.on{opacity:1;text-shadow:0 0 .5em color-mix(in srgb,currentColor 55%,transparent)}
.ta-pop{display:inline-block;transform:translateY(.4em);opacity:0;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .4s}
.ta-pop.on{transform:none;opacity:1}
[data-rich] a{color:var(--accent-soft)}

/* Vorschau im Editor: Leisten, Einfügen, Ziehen */
.jr-ui{position:absolute;z-index:40;font:12px/1 system-ui,sans-serif}
.jr-secbar,.jr-elbar{display:flex;align-items:center;gap:2px;padding:3px;background:#16191c;color:#ebe7e0;border:1px solid #333b40;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.jr-secbar button,.jr-elbar button{all:unset;cursor:pointer;padding:5px 7px;border-radius:4px;color:#ebe7e0;white-space:nowrap}
.jr-secbar button:hover,.jr-elbar button:hover{background:#2a3136}
.jr-ui .grip{cursor:grab;padding:5px 6px;color:#8f999d;letter-spacing:-2px}
.jr-ui .grip:active{cursor:grabbing}
.jr-ui .nm{padding:0 8px 0 2px;color:#8f999d;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.jr-elbar{border-color:var(--accent)}
.jr-ins{all:unset;cursor:pointer;background:var(--accent);color:var(--on-accent);padding:6px 12px;border-radius:999px;font:600 11px/1 system-ui,sans-serif;letter-spacing:.04em;box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:.9}
.jr-ins:hover{opacity:1}
.jr-itembar{border-color:#5b8cff}
.jr-btnbar{z-index:46;display:flex;flex-direction:column;gap:8px;padding:10px;width:300px;background:#16191c;color:#ebe7e0;border:1px solid #333b40;border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.jr-btnbar .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.jr-btnbar .row.fields{flex-direction:column;align-items:stretch}
.jr-btnbar .nm{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8f999d}
.jr-btnbar input[type=text]{all:unset;box-sizing:border-box;width:100%;padding:7px 8px;border:1px solid #333b40;border-radius:4px;background:#0e1113;color:#ebe7e0;font-size:12px}
.jr-btnbar select{all:unset;box-sizing:border-box;width:100%;padding:7px 8px;border:1px solid #333b40;border-radius:4px;background:#0e1113;color:#ebe7e0;font-size:12px;cursor:pointer}
.jr-btnbar .sum{font-size:11px;color:#9fd3b0;line-height:1.35}
.jr-btnbar input[type=text]:focus{border-color:#ebe7e0}
.jr-btnbar button{all:unset;cursor:pointer;padding:6px 8px;border:1px solid #333b40;border-radius:4px;font-size:11px;color:#ebe7e0}
.jr-btnbar button:hover{border-color:#ebe7e0}
.jr-btnbar button.on{background:#ebe7e0;color:#111}
.jr-btnbar button.c{width:22px;height:22px;padding:0;border-color:rgba(255,255,255,.25)}
.jr-btnbar button.c.on{outline:2px solid #fff;outline-offset:2px}
.jr-btnbar input[type=color]{width:26px;height:24px;border:0;padding:0;background:none;cursor:pointer}
.jr-btnbar .foot{justify-content:space-between}
.jr-btnbar .danger{color:#ee6a6a}
.jr-drop{position:absolute;z-index:45;background:var(--accent);border-radius:2px;pointer-events:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.jr-dragging{opacity:.35}
.jr-target{outline:3px dashed var(--accent)!important;outline-offset:-6px}
.preview-mode [contenteditable]{outline:none;cursor:text}
.preview-mode [contenteditable]:focus{outline:2px solid var(--accent)!important;outline-offset:3px;border-radius:2px}
.preview-mode .free.extras:empty{display:none}

/* NDA, geschützt, geplant */
.still.ndabox,.still.lockbox{display:grid;place-items:center;text-align:center;background:
  repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--fg) 4%,transparent) 14px 15px),
  radial-gradient(120% 90% at 30% 20%,color-mix(in srgb,var(--accent) 16%,var(--panel)) 0%,var(--panel) 60%)}
.still.ndabox.wide,.still.lockbox.wide{aspect-ratio:3/1}
@media (max-width:640px){.still.ndabox.wide,.still.lockbox.wide{aspect-ratio:16/9}}
.ndabox .lk,.lockbox .lk{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px;color:var(--fg)}
.ndabox .lk svg,.lockbox .lk svg{color:var(--accent)}
.ndabox .lk b,.lockbox .lk b{font-family:var(--display);font-stretch:var(--hstretch);font-weight:var(--hweight);text-transform:var(--hcase);font-size:calc(clamp(26px,3vw,40px) * var(--hs));line-height:1}
.lockbox .btn{margin-top:4px}
.vis-tag{position:absolute;left:10px;top:10px;z-index:4;display:inline-block;padding:4px 8px;border-radius:3px;background:#5b8cff;color:#fff;font:600 11px/1.2 system-ui,sans-serif}
.series .vis-tag,.vis-sec .vis-tag{position:static}
.vis-sec{margin-bottom:16px}
.film.pending{opacity:.55}
.unlock-msg{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--panel);color:var(--fg);border:1px solid var(--accent);padding:12px 18px;font-family:var(--mono);font-size:12px;letter-spacing:.04em}

/* Projekt-Steckbrief (ohne Video) */
.pj{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,4vw,48px);align-items:start;border:1px solid var(--line);background:var(--panel);padding:clamp(16px,2.4vw,28px);border-radius:var(--radius)}
.pj.no-media{grid-template-columns:1fr}
.w-half .pj,.w-third .pj{grid-template-columns:1fr}
@media (max-width:860px){.pj{grid-template-columns:1fr}}
.pj-media{position:relative;aspect-ratio:16/9;max-width:100%;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius)}
.pj-media img{width:100%;height:100%;object-fit:cover}
.pj-media.still{width:100%}
.pj-st{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;padding:3px 8px}
.pj-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.pj h3{font-size:calc(clamp(28px,3.4vw,46px) * var(--hs))}
.pj-client{color:var(--muted);font-size:.94em;margin-top:-6px}
.pj-stats{display:flex;flex-wrap:wrap;gap:16px 36px;padding-top:12px;border-top:1px solid var(--line)}
.pj-stats>div{display:flex;flex-direction:column;gap:4px}
.pj-stats b{font-family:var(--display);font-stretch:var(--hstretch);font-weight:var(--hweight);font-size:calc(clamp(32px,4vw,52px) * var(--hs));line-height:.9}
.ta-center .pj-body{text-align:left}

/* Einklappbare Abschnitte */
.sec-head .sec-toggle{order:-1;align-self:center;margin-right:-8px}
.sec-toggle{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--fg);display:grid;place-items:center;cursor:pointer;transition:border-color .2s,background .2s}
.sec-toggle:hover{border-color:var(--accent);color:var(--accent)}
.sec-toggle svg{transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.sec.collapsed .sec-toggle svg{transform:rotate(-90deg)}
.sec-head:has(.sec-toggle){display:grid;grid-template-columns:auto 1fr auto;align-items:end;column-gap:20px}
.sec-head:has(.sec-toggle) > h2{grid-column:2}
.sec-head:has(.sec-toggle) > .sec-toggle{grid-column:1;grid-row:1;align-self:center}
.sec-head:has(.sec-toggle) > p,.sec-head:has(.sec-toggle) > .mono{grid-column:3;grid-row:1}
@media (max-width:760px){.sec-head:has(.sec-toggle){grid-template-columns:auto 1fr}.sec-head:has(.sec-toggle) > p,.sec-head:has(.sec-toggle) > .mono{grid-column:1 / -1;grid-row:2;margin-top:16px}}
html:not(.preview-mode) .sec.foldable .sec-head h2{cursor:pointer}
.sec-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .55s cubic-bezier(.2,.7,.2,1)}
.sec-body>div{min-height:0}
.sec-body.clipping>div{overflow:hidden}
.sec.collapsed .sec-body{grid-template-rows:0fr}
.sec.collapsed .sec-head{margin-bottom:0;transition:margin .4s}
.sec .sec-head{transition:margin .4s}
.sec.collapsed.pad-m,.sec.collapsed.pad-l{padding-block:clamp(36px,5vw,56px)}
.sec{transition:padding .45s ease}
.al-center .sec-head:has(.sec-toggle){display:flex;flex-direction:column;align-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Überschriften: kurze Wörter nie trennen */
h1,h2,h3{hyphenate-limit-chars:12 5 5;-webkit-hyphenate-limit-before:5;-webkit-hyphenate-limit-after:5}
.hero h1{hyphens:manual;-webkit-hyphens:manual;font-size:calc(clamp(52px,9.6vw,156px) * var(--hs))}

/* Foto-Raster: am Handy 2 Spalten ohne Lücke */
@media (max-width:860px){
  .grid:not(.masonry) .ph{grid-column:auto!important;aspect-ratio:var(--pb)!important}
  .grid:not(.masonry) .ph:last-child:nth-child(odd){grid-column:span 2!important;aspect-ratio:var(--pb2)!important}
}
.more-row{display:flex;justify-content:center;margin-top:18px}
#lb{z-index:56}
.lb.gal{align-items:flex-start;overflow:auto;padding-top:max(24px,env(safe-area-inset-top,0px))}
.gal-card{width:min(1200px,100%);display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.gal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;background:rgba(6,7,8,.92);padding:10px 0;z-index:2}
.gal-grid{columns:4 220px;column-gap:10px}
.gal-grid .ph{aspect-ratio:auto;margin-bottom:10px;break-inside:avoid}
.gal-grid .ph img{height:auto}

/* Kontaktformular */
.contact-grid.with-form{grid-template-columns:1.5fr 1fr;align-items:start}
@media (max-width:860px){.contact-grid.with-form{grid-template-columns:1fr}}
.cform{display:flex;flex-direction:column;gap:14px;padding:clamp(18px,3vw,32px);border:1px solid var(--line);background:var(--panel);border-radius:var(--radius)}
.cform h3{font-size:calc(clamp(26px,3vw,40px) * var(--hs));margin-bottom:6px}
.cf-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.cf-row{grid-template-columns:1fr}}
.cf{display:flex;flex-direction:column;gap:6px;min-width:0}
.cf>span{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cf input,.cf select,.cf textarea{font:inherit;font-size:16px;padding:12px 14px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--radius);width:100%;min-width:0}
.cf textarea{resize:vertical;min-height:120px}
.cf input:focus,.cf select:focus,.cf textarea:focus{outline:none;border-color:var(--accent)}
.cf-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.cf-ok{display:flex;gap:10px;align-items:flex-start;font-size:.88em;color:var(--muted);text-align:left}
.cf-ok input{margin-top:3px;accent-color:var(--accent);width:18px;height:18px;flex:none}
.cf-ok a{color:var(--fg)}
.cf-err{min-height:1.2em;color:var(--accent-soft);font-size:.92em}
.cform .btn{align-self:flex-start}
.cf-done{padding:clamp(24px,4vw,48px);border:1px solid var(--accent);background:var(--panel);display:flex;gap:18px;align-items:center;border-radius:var(--radius)}
.cf-done b{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:24px;flex:none}
.cf-done p{font-size:1.1em}
.cside{display:flex;flex-direction:column;gap:0}

/* Vorschau im Editor: Abschnitt anklickbar */
.preview-mode .sec{cursor:pointer;position:relative}
.preview-mode .sec:hover{outline:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:-2px}
.preview-mode .sec.selected{outline:2px solid var(--accent);outline-offset:-2px}

.no-motion *,.no-motion *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

      <button class="btn lb-all" id="lbAll" type="button" hidden>Alle Fotos ansehen</button>
      <div class="lb-nav" id="lbNav">
        <button class="btn" id="lbPrev" type="button">← Zurück</button>
        <button class="btn" id="lbNext" type="button">Weiter →</button>
      </div>
    </div>
  </div>
</div>

<div class="lb gal" id="galBox" hidden role="dialog" aria-modal="true" aria-labelledby="galTitle">
  <div class="gal-card">
    <div class="gal-head"><span class="mono" id="galTitle">Fotos</span><button class="btn" type="button" id="galClose">Schließen ✕</button></div>
    <div class="gal-grid" id="galGrid"></div>
  </div>
</div>

<div class="lb" id="codeBox" hidden role="dialog" aria-modal="true" aria-labelledby="codeTitle">
  <form class="login-card" id="codeForm" autocomplete="off">
    <div class="login-head"><span class="mono">Kundenzugang</span><button class="x" type="button" id="codeClose" aria-label="Schließen">✕</button></div>
    <h3 id="codeTitle">Code eingeben</h3>
    <p class="mono">Du hast einen Zugangscode für geschützte Projekte bekommen? Gib ihn hier ein.</p>
    <label class="mono" for="codeIn">Zugangscode</label>
    <input id="codeIn" name="code" type="text" autocapitalize="characters" spellcheck="false" required>
    <p class="err" id="codeErr" role="alert"></p>
    <button class="btn primary" type="submit" id="codeBtn">Freischalten</button>
  </form>
</div>
<div class="unlock-msg" id="unlockMsg" hidden role="status"></div>

<div class="lb" id="login" hidden role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-head"><span class="rec"><i></i>REC</span><button class="x" type="button" id="loginClose" aria-label="Schließen">✕</button></div>
    <h3 id="loginTitle">Editor</h3>
    <p class="mono" id="loginHint">Passwort eingeben, um die Website zu bearbeiten.</p>
    <label class="mono" for="pw">Passwort</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary" type="submit" id="loginBtn">Anmelden</button>
  </form>
</div>

<script src="sections.js"></script>
<script src="richtext.js"></script>
<script src="api.js"></script>
<script src="render.js"></script>
</body>
</html>
