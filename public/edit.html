<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Editor · Janosch Rajewski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Editor: same grading-suite world as the site, laid out like an edit bay. Top bar = transport controls, sections = bins. */
:root{
  --bg:#0e1113; --panel:#151a1d; --panel2:#1b2125; --line:#283034; --fg:#ebe7e0; --muted:#8f999d;
  --red:#d6363d; --red-soft:#ee6a6a; --ok:#5fbf8a; --warn:#e7b04a;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-stretch:68%;font-weight:800;text-transform:uppercase;line-height:.95;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#e84a50}
.btn.small{padding:6px 9px}
.btn.danger{color:var(--red-soft)}
.btn.danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px}
.bar .title{display:flex;align-items:center;gap:10px;margin-right:auto}
.bar .title i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red)}
.bar .title b{font-family:var(--display);font-stretch:75%;font-size:18px;text-transform:uppercase}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.status.dirty{color:var(--warn)}
.status.ok{color:var(--ok)}
.status.err{color:var(--red-soft)}

.notice{margin-top:16px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.notice b{color:var(--warn)}

main{padding-block:24px 80px;display:flex;flex-direction:column;gap:40px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head h2{font-size:40px}
.sec-head h2 span{color:var(--red)}

/* Cards */
.card{background:var(--panel);border:1px solid var(--line);display:grid;grid-template-columns:300px 1fr;gap:20px;padding:16px;margin-bottom:14px}
@media (max-width:820px){.card{grid-template-columns:1fr}}
.card-tools{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.card-tools .grp{display:flex;gap:6px;flex-wrap:wrap}
.preview{display:flex;flex-direction:column;gap:8px;min-width:0}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.thumb img,.thumb video,.thumb iframe{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0}
.thumb .src{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;padding:2px 6px;background:rgba(0,0,0,.6);color:#fff}
.thumb .src.yt{background:var(--red)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field .help{font-size:12px;color:var(--muted)}
.field .help.ok{color:var(--ok)}
.field .help.bad{color:var(--red-soft)}
input[type=text],input[type=url],input[type=password],textarea{font:inherit;font-size:15px;padding:9px 11px;background:var(--bg);color:var(--fg);border:1px solid var(--line);width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,textarea:focus{outline:none;border-color:var(--red)}
.yt-field input{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.prog{height:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}

/* Photo series */
.series{background:var(--panel);border:1px solid var(--line);padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:14px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.photo{background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.photo .pimg{aspect-ratio:4/5;max-width:100%;overflow:hidden;position:relative}
.photo .pimg img{width:100%;height:100%;object-fit:cover}
.photo .pimg .badge{position:absolute;left:6px;top:6px;font-family:var(--mono);font-size:10px;padding:1px 5px;background:var(--red);color:#fff}
.photo .pctl{padding:8px;display:flex;flex-direction:column;gap:6px}
.photo .pctl input{font-size:13px;padding:6px 8px}
.photo .row{display:flex;gap:4px;flex-wrap:wrap}
.photo .row .btn{padding:5px 7px;font-size:10px}
.addph{border:1px dashed var(--line);display:grid;place-items:center;text-align:center;min-height:180px;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:12px}
.addph:hover{border-color:var(--red);color:var(--fg)}
.add-big{width:100%;padding:16px;border-style:dashed}

/* Login gate */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate form{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:12px}
.gate h1{font-size:44px}
.gate .err{color:var(--red-soft);min-height:1.4em;margin:0;font-size:14px}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;z-index:20;max-width:calc(100% - 32px)}
.toast.err{border-color:var(--red);color:var(--red-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <span class="mono">Janosch Rajewski · Editor</span>
    <h1>Anmelden</h1>
    <p class="mono" id="gateHint">Passwort eingeben.</p>
    <input id="gatePw" type="password" autocomplete="current-password" aria-label="Passwort" required>
    <p class="err" id="gateErr" role="alert"></p>
    <button class="btn primary" type="submit">Anmelden</button>
    <a class="btn" href="index.html">← Zur Website</a>
  </form>
</div>

<div id="app" hidden>
  <header class="bar">
    <div class="wrap">
      <div class="title"><i></i><b>Website-Editor</b></div>
      <span class="status" id="status">Geladen</span>
      <a class="btn" href="index.html" id="viewBtn">Website ansehen</a>
      <button class="btn" type="button" id="logoutBtn">Abmelden</button>
      <button class="btn primary" type="button" id="saveBtn">Speichern & veröffentlichen</button>
    </div>
  </header>

  <div class="wrap" id="notices"></div>

  <main class="wrap">
    <section>
      <div class="sec-head"><h2>Showreel<span>.</span></h2><span class="mono">Großer Kasten ganz oben</span></div>
      <div class="card" id="showreelCard"></div>
    </section>

    <section>
      <div class="sec-head"><h2>Über mich<span>.</span></h2><span class="mono">Dein Porträt</span></div>
      <div class="card" id="aboutCard"></div>
    </section>

    <section>
      <div class="sec-head"><h2>Filme<span>.</span></h2><span class="mono">Reihenfolge = Reihenfolge auf der Website</span></div>
      <div id="filmsList"></div>
      <button class="btn add-big" type="button" id="addFilm">+ Film hinzufügen</button>
    </section>

    <section>
      <div class="sec-head"><h2>Fotografie<span>.</span></h2><span class="mono">Serien mit Fotos</span></div>
      <div id="seriesList"></div>
      <button class="btn add-big" type="button" id="addSeries">+ Fotoserie hinzufügen</button>
    </section>
  </main>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="api.js"></script>
<script>
(function(){
  var A=window.SiteAPI, esc=A.esc, D=null, dirty=false, MODE='demo';
  var $=function(id){return document.getElementById(id)};

  // ---------- Hilfen ----------
  function toast(msg,isErr){var t=$('toast');t.textContent=msg;t.className='toast'+(isErr?' err':'');t.hidden=false;clearTimeout(t._h);t._h=setTimeout(function(){t.hidden=true},isErr?6000:2600);}
  function setStatus(txt,cls){var s=$('status');s.textContent=txt;s.className='status'+(cls?' '+cls:'');}
  function markDirty(){dirty=true;setStatus('● Ungespeicherte Änderungen','dirty');}
  function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function move(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t;}
  // Löschen mit zweitem Klick bestätigen (kein Browser-Dialog)
  function armDelete(btn,fn){
    if(btn.classList.contains('armed')){fn();return;}
    btn.classList.add('armed');var old=btn.textContent;btn.textContent='Wirklich löschen?';
    setTimeout(function(){if(btn.isConnected){btn.classList.remove('armed');btn.textContent=old;}},3000);
  }
  function uploadInto(file,progEl){
    if(progEl){progEl.hidden=false;progEl.firstChild.style.width='5%';}
    return A.upload(file,function(p){if(progEl)progEl.firstChild.style.width=Math.round(p*100)+'%';})
      .then(function(r){if(progEl)progEl.hidden=true;return r.src;})
      .catch(function(e){if(progEl)progEl.hidden=true;toast(e.message,true);throw e;});
  }
  function ytHelp(v){
    if(!v) return '<span class="help">YouTube-Link einfügen, z. B. https://youtu.be/…</span>';
    return A.ytId(v)?'<span class="help ok">✓ YouTube-Video erkannt. Es läuft direkt auf deiner Website.</span>':'<span class="help bad">Link nicht erkannt. Kopiere den Link aus „Teilen“ bei YouTube.</span>';
  }
  function thumbHTML(o){
    var id=A.ytId(o.youtube);
    if(o.image) return '<img src="'+esc(o.image)+'" alt="">'+(id?'<span class="src yt">YouTube</span>':o.video?'<span class="src">Video-Datei</span>':'');
    if(id) return '<img src="'+A.ytThumb(id)+'" alt=""><span class="src yt">YouTube-Vorschau</span>';
    if(o.video) return '<video src="'+esc(o.video)+'" muted playsinline preload="metadata"></video><span class="src">Video-Datei</span>';
    return '<span class="mono">Noch kein Bild</span>';
  }

  // ---------- Showreel ----------
  function renderShowreel(){
    var s=D.showreel=D.showreel||{};
    var el=$('showreelCard');
    el.innerHTML=
      '<div class="preview"><div class="thumb" id="srThumb">'+(s.heroImage?'<img src="'+esc(s.heroImage)+'" alt="">':'<span class="mono">Kein Bild</span>')+'<span class="src">Hintergrundbild</span></div>'+
        '<div class="upl btn small">Hintergrundbild ändern<input type="file" accept="image/*" data-k="heroImage"></div><div class="prog" hidden><i></i></div></div>'+
      '<div class="fields">'+
        '<div class="field full yt-field"><label for="srYt">Showreel auf YouTube</label><input id="srYt" type="url" placeholder="https://youtu.be/…" value="'+esc(s.youtube)+'"><div id="srHelp">'+ytHelp(s.youtube)+'</div></div>'+
        '<div class="field full"><label>Oder eigene Videodatei (MP4, auch mehrere GB)</label>'+
          '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="upl btn small">Video hochladen<input type="file" accept="video/mp4,video/webm,video/quicktime" data-k="video"></div>'+
          (s.video?'<span class="help">✓ Video hochgeladen</span><button class="btn small danger" type="button" id="srVidDel">Video entfernen</button>':'<span class="help">Kein Video</span>')+'</div>'+
          '<span class="help">Wenn ein YouTube-Link eingetragen ist, wird YouTube bevorzugt. Tipp: Videos als MP4 (H.264, 1080p) exportieren, dann laufen sie überall flüssig.</span></div>'+
      '</div>';
    $('srYt').oninput=function(){s.youtube=this.value.trim();$('srHelp').innerHTML=ytHelp(s.youtube);markDirty();};
    el.querySelectorAll('input[type=file]').forEach(function(inp){
      inp.onchange=function(){var f=inp.files[0];if(!f)return;var prog=el.querySelector('.prog');
        uploadInto(f,prog).then(function(src){s[inp.getAttribute('data-k')]=src;markDirty();renderShowreel();}).catch(function(){});};
    });
    var del=$('srVidDel');if(del)del.onclick=function(){armDelete(del,function(){s.video='';markDirty();renderShowreel();});};
  }

  // ---------- Filme ----------
  function renderFilms(){
    var list=$('filmsList');
    list.innerHTML=D.films.map(function(f,i){
      return '<div class="card" data-i="'+i+'">'+
        '<div class="preview"><div class="thumb">'+thumbHTML(f)+'</div>'+
          '<div style="display:flex;gap:6px;flex-wrap:wrap"><div class="upl btn small">Standbild hochladen<input type="file" accept="image/*" data-k="image"></div>'+
          (f.image?'<button class="btn small" type="button" data-act="noimg">Standbild entfernen</button>':'')+'</div>'+
          '<span class="help mono" style="text-transform:none;letter-spacing:0">'+(f.image?'Eigenes Standbild':'Ohne Standbild wird das YouTube-Vorschaubild genutzt.')+'</span>'+
          '<div class="prog" hidden><i></i></div></div>'+
        '<div class="fields">'+
          '<div class="field full yt-field"><label>YouTube-Link</label><input type="url" data-k="youtube" placeholder="https://youtu.be/…" value="'+esc(f.youtube)+'"><div class="yth">'+ytHelp(f.youtube)+'</div></div>'+
          '<div class="field"><label>Titel</label><input type="text" data-k="title" value="'+esc(f.title)+'"></div>'+
          '<div class="field"><label>Untertitel / Künstler</label><input type="text" data-k="subtitle" value="'+esc(f.subtitle)+'"></div>'+
          '<div class="field"><label>Art</label><input type="text" data-k="kind" placeholder="z. B. Kurzfilm" value="'+esc(f.kind)+'"></div>'+
          '<div class="field"><label>Datum</label><input type="text" data-k="date" placeholder="z. B. Mai 2026" value="'+esc(f.date)+'"></div>'+
          '<div class="field"><label>Etikett auf dem Bild</label><input type="text" data-k="badge" placeholder="z. B. Musikvideo" value="'+esc(f.badge)+'"></div>'+
          '<div class="field"><label>Meine Rolle (mit Komma trennen)</label><input type="text" data-k="roles" value="'+esc((f.roles||[]).join(', '))+'"></div>'+
          '<div class="field full"><label>Beschreibung</label><textarea data-k="text">'+esc(f.text)+'</textarea></div>'+
          '<div class="field full"><label>Team</label><input type="text" data-k="crew" value="'+esc(f.crew)+'"></div>'+
          '<div class="field full"><label>Oder eigene Videodatei statt YouTube (MP4, auch mehrere GB)</label><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
            '<div class="upl btn small">Video hochladen<input type="file" accept="video/mp4,video/webm,video/quicktime" data-k="video"></div>'+
            (f.video?'<span class="help">✓ Video hochgeladen</span><button class="btn small" type="button" data-act="novid">Video entfernen</button>':'<span class="help">Kein Video</span>')+'</div></div>'+
        '</div>'+
        '<div class="card-tools"><div class="grp"><button class="btn small" type="button" data-act="up"'+(i===0?' disabled':'')+'>↑ Nach oben</button><button class="btn small" type="button" data-act="down"'+(i===D.films.length-1?' disabled':'')+'>↓ Nach unten</button></div>'+
          '<button class="btn small danger" type="button" data-act="del">Film löschen</button></div>'+
      '</div>';
    }).join('')||'<p class="mono">Noch keine Filme.</p>';

    list.querySelectorAll('.card').forEach(function(card){
      var i=+card.getAttribute('data-i'), f=D.films[i];
      card.querySelectorAll('input[data-k]:not([type=file]),textarea[data-k]').forEach(function(inp){
        inp.oninput=function(){
          var k=inp.getAttribute('data-k'), v=inp.value;
          f[k]=k==='roles'?v.split(',').map(function(x){return x.trim();}).filter(Boolean):v;
          if(k==='youtube'){f.youtube=v.trim();card.querySelector('.yth').innerHTML=ytHelp(f.youtube);card.querySelector('.thumb').innerHTML=thumbHTML(f);}
          markDirty();
        };
      });
      card.querySelectorAll('input[type=file]').forEach(function(inp){
        inp.onchange=function(){var file=inp.files[0];if(!file)return;
          uploadInto(file,card.querySelector('.prog')).then(function(src){f[inp.getAttribute('data-k')]=src;markDirty();renderFilms();toast('Hochgeladen. Speichern nicht vergessen.');}).catch(function(){});};
      });
      card.querySelectorAll('[data-act]').forEach(function(b){
        b.onclick=function(){
          var a=b.getAttribute('data-act');
          if(a==='up'){move(D.films,i,-1);}
          else if(a==='down'){move(D.films,i,1);}
          else if(a==='noimg'){f.image='';}
          else if(a==='novid'){f.video='';}
          else if(a==='del'){return armDelete(b,function(){D.films.splice(i,1);markDirty();renderFilms();});}
          markDirty();renderFilms();
        };
      });
    });
  }

  // ---------- Fotoserien ----------
  function renderSeries(){
    var list=$('seriesList');
    list.innerHTML=D.series.map(function(s,si){
      return '<div class="series" data-si="'+si+'">'+
        '<div class="fields"><div class="field"><label>Titel der Serie</label><input type="text" data-k="title" value="'+esc(s.title)+'"></div>'+
          '<div class="field full"><label>Text</label><textarea data-k="text">'+esc(s.text)+'</textarea></div></div>'+
        '<div class="photos">'+(s.photos||[]).map(function(p,pi){
          return '<div class="photo" data-pi="'+pi+'"><div class="pimg"><img src="'+esc(p.src)+'" alt="">'+(p.wide?'<span class="badge">BREIT</span>':'')+'</div>'+
            '<div class="pctl"><input type="text" data-pk="alt" placeholder="Bildbeschreibung" value="'+esc(p.alt)+'" aria-label="Bildbeschreibung">'+
            '<div class="row"><button class="btn" type="button" data-pa="left"'+(pi===0?' disabled':'')+' aria-label="Nach links">←</button><button class="btn" type="button" data-pa="right"'+(pi===s.photos.length-1?' disabled':'')+' aria-label="Nach rechts">→</button>'+
            '<button class="btn" type="button" data-pa="wide">'+(p.wide?'Normal':'Breit')+'</button><button class="btn danger" type="button" data-pa="del">Löschen</button></div></div></div>';
        }).join('')+
          '<label class="addph upl"><span>+ Fotos hochladen<br><span style="text-transform:none;letter-spacing:0">mehrere auf einmal möglich</span></span><input type="file" accept="image/*" multiple></label>'+
        '</div><div class="prog" hidden><i></i></div>'+
        '<div class="card-tools"><div class="grp"><button class="btn small" type="button" data-sa="up"'+(si===0?' disabled':'')+'>↑ Serie nach oben</button><button class="btn small" type="button" data-sa="down"'+(si===D.series.length-1?' disabled':'')+'>↓ Serie nach unten</button></div>'+
          '<button class="btn small danger" type="button" data-sa="del">Serie löschen</button></div>'+
      '</div>';
    }).join('')||'<p class="mono">Noch keine Fotoserien.</p>';

    list.querySelectorAll('.series').forEach(function(box){
      var si=+box.getAttribute('data-si'), s=D.series[si];
      s.photos=s.photos||[];
      box.querySelectorAll('[data-k]').forEach(function(inp){inp.oninput=function(){s[inp.getAttribute('data-k')]=inp.value;markDirty();};});
      box.querySelectorAll('.photo').forEach(function(ph){
        var pi=+ph.getAttribute('data-pi'), p=s.photos[pi];
        ph.querySelector('[data-pk]').oninput=function(){p.alt=this.value;markDirty();};
        ph.querySelectorAll('[data-pa]').forEach(function(b){b.onclick=function(){
          var a=b.getAttribute('data-pa');
          if(a==='left')move(s.photos,pi,-1);
          else if(a==='right')move(s.photos,pi,1);
          else if(a==='wide')p.wide=!p.wide;
          else if(a==='del')return armDelete(b,function(){s.photos.splice(pi,1);markDirty();renderSeries();});
          markDirty();renderSeries();
        };});
      });
      var fin=box.querySelector('.addph input');
      fin.onchange=function(){
        var files=[].slice.call(fin.files), prog=box.querySelector('.prog'), done=0;
        if(!files.length)return;
        setStatus('Lade '+files.length+' Foto(s) hoch …');
        files.reduce(function(chain,file){
          return chain.then(function(){return uploadInto(file,prog).then(function(src){s.photos.push({src:src,alt:'',wide:false});done++;}).catch(function(){});});
        },Promise.resolve()).then(function(){if(done){markDirty();toast(done+' Foto(s) hochgeladen. Speichern nicht vergessen.');}renderSeries();});
      };
      box.querySelectorAll('[data-sa]').forEach(function(b){b.onclick=function(){
        var a=b.getAttribute('data-sa');
        if(a==='up')move(D.series,si,-1);
        else if(a==='down')move(D.series,si,1);
        else if(a==='del')return armDelete(b,function(){D.series.splice(si,1);markDirty();renderSeries();});
        markDirty();renderSeries();
      };});
    });
  }

  // ---------- Porträt ----------
  function renderAbout(){
    var a=D.about=D.about||{}, el=$('aboutCard');
    el.innerHTML=
      '<div class="preview"><div class="thumb" style="aspect-ratio:4/5">'+(a.image?'<img src="'+esc(a.image)+'" alt="">':'<span class="mono">Kein Bild</span>')+'</div>'+
        '<div class="upl btn small">Porträt hochladen<input type="file" accept="image/*"></div><div class="prog" hidden><i></i></div></div>'+
      '<div class="fields"><div class="field full"><label for="abCap">Bildunterschrift</label><input id="abCap" type="text" placeholder="z. B. Am Set, 2026 (leer lassen = keine)" value="'+esc(a.caption)+'">'+
        '<span class="help">Am besten ein Hochformat-Foto (4:5). Es wird passend zugeschnitten.</span></div></div>';
    $('abCap').oninput=function(){a.caption=this.value;markDirty();};
    var inp=el.querySelector('input[type=file]');
    inp.onchange=function(){var f=inp.files[0];if(!f)return;
      uploadInto(f,el.querySelector('.prog')).then(function(src){a.image=src;markDirty();renderAbout();toast('Porträt hochgeladen. Speichern nicht vergessen.');}).catch(function(){});};
  }

  function renderAll(){renderShowreel();renderAbout();renderFilms();renderSeries();}

  $('addFilm').onclick=function(){
    D.films.unshift({id:uid(),title:'Neuer Film',subtitle:'',kind:'',date:'',badge:'',text:'',roles:[],crew:'',youtube:'',video:'',image:''});
    markDirty();renderFilms();
    var first=document.querySelector('#filmsList .card input[data-k=youtube]');if(first){first.scrollIntoView({block:'center'});first.focus();}
  };
  $('addSeries').onclick=function(){
    D.series.push({id:uid(),title:'Neue Serie',text:'',photos:[]});markDirty();renderSeries();
    var boxes=document.querySelectorAll('#seriesList .series');var b=boxes[boxes.length-1];if(b){b.scrollIntoView({block:'center'});b.querySelector('input').select();}
  };

  // ---------- Speichern ----------
  $('saveBtn').onclick=function(){
    var b=this;b.disabled=true;setStatus('Speichere …');
    A.save(D).then(function(){dirty=false;setStatus('✓ Gespeichert · '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),'ok');toast(MODE==='demo'?'Gespeichert (nur in diesem Browser, Vorschau-Modus).':'Gespeichert. Die Website ist aktualisiert.');})
      .catch(function(e){setStatus('Fehler beim Speichern','err');toast(e.message,true);if(e.status===401){A.logout();showGate('Login abgelaufen. Bitte neu anmelden, deine Änderungen bleiben erhalten.');}})
      .then(function(){b.disabled=false;});
  };
  $('logoutBtn').onclick=function(){A.logout();location.href='index.html';};
  // "Website ansehen" speichert vorher automatisch
  $('viewBtn').onclick=function(e){
    if(!dirty) return;
    e.preventDefault(); setStatus('Speichere …');
    A.save(D).then(function(){dirty=false;location.href='index.html';})
      .catch(function(x){setStatus('Fehler beim Speichern','err');toast(x.message,true);});
  };
  window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
  document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();$('saveBtn').click();}});

  // ---------- Login / Start ----------
  function showGate(msg){
    $('gate').hidden=false;$('gateErr').textContent=msg||'';
    $('gateHint').textContent=MODE==='demo'?'Vorschau-Modus: Passwort ist „demo“.':'Passwort eingeben.';
    $('gatePw').focus();
  }
  $('gateForm').onsubmit=function(e){
    e.preventDefault();$('gateErr').textContent='';
    A.login($('gatePw').value).then(function(){$('gate').hidden=true;start();}).catch(function(x){$('gateErr').textContent=x.message;});
  };
  function notices(){
    var n=[];
    if(MODE==='demo'&&/(workers|pages)\.dev$|\.[a-z]{2,}$/.test(location.hostname)&&!/claude|localhost/.test(location.hostname)) n.push('<div class="notice warn"><b>Der Server-Teil läuft nicht.</b> Die Website ist online, aber Login und Speichern laufen nur im Browser. Prüfe in der README, Abschnitt „Cloudflare einrichten“, ob die Datei <code>wrangler.jsonc</code> hochgeladen ist und das Deployment ohne Fehler durchlief.</div>');
    else if(MODE==='demo') n.push('<div class="notice warn"><b>Vorschau-Modus.</b> Hier läuft kein Server, deshalb speichert der Editor nur in diesem Browser. Fotos werden verkleinert, Video-Upload ist aus. Auf deiner veröffentlichten Cloudflare-Seite speichert er für alle Besucher.</div>');
    var h=A.health||{};
    if(MODE==='live'&&(!h.r2||!h.password)) n.push('<div class="notice warn"><b>Noch nicht fertig eingerichtet:</b> '+(!h.r2?'R2-Speicher „MEDIA“ fehlt, Speichern und Uploads gehen nicht. ':'')+(!h.password?'Passwort ADMIN_PASSWORD fehlt. ':'')+'Siehe README.</div>');
    $('notices').innerHTML=n.join('');
  }
  function start(){
    if(D){$('app').hidden=false;return;}
    A.getContent().then(function(d){
      D=d;D.films=D.films||[];D.series=D.series||[];D.showreel=D.showreel||{};
      $('app').hidden=false;notices();renderAll();
    }).catch(function(){toast('Inhalte konnten nicht geladen werden.',true);});
  }
  A.mode().then(function(m){MODE=m;if(A.token())start();else showGate();});
})();
</script>
</body>
</html>
