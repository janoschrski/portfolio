<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Editor · Janosch Rajewski</title>
<link rel="stylesheet" href="fonts/archivo.css">
<link rel="stylesheet" href="fonts/ibm-plex-sans.css">
<link rel="stylesheet" href="fonts/ibm-plex-mono.css">
<style>
/* Editor wie ein Schnittplatz: links die Werkzeuge, rechts der Programm-Monitor (Live-Vorschau). */
:root{
  --bg:#0e1113; --panel:#151a1d; --panel2:#1b2125; --line:#283034; --fg:#ebe7e0; --muted:#8f999d;
  --red:#d6363d; --red-soft:#ee6a6a; --ok:#5fbf8a; --warn:#e7b04a;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);font-stretch:68%;font-weight:800;text-transform:uppercase;line-height:.95;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border:1px solid var(--line);background:none;color:var(--fg);cursor:pointer;white-space:nowrap;border-radius:2px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#e84a50}
.btn.ghost{border-color:transparent}
.btn.ghost:hover{border-color:var(--line);background:var(--panel2)}
.btn.icon{padding:6px 8px;min-width:30px}
.btn.danger{color:var(--red-soft)}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.on{background:var(--panel2);border-color:var(--fg)}

/* Kopfzeile */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.bar .title{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.bar .title i{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);flex:none}
.bar .title b{font-family:var(--display);font-stretch:75%;font-size:18px;text-transform:uppercase;white-space:nowrap}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.status.dirty{color:var(--warn)}.status.ok{color:var(--ok)}.status.err{color:var(--red-soft)}
.grp{display:flex;gap:4px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
@media (max-width:760px){.hide-m{display:none!important}}

/* Arbeitsbereich */
.work{flex:1;display:grid;grid-template-columns:minmax(340px,440px) 1fr;min-height:0}
@media (max-width:1000px){.work{grid-template-columns:1fr}.preview-pane{display:none}.work.show-preview .preview-pane{display:flex;position:fixed;inset:0;z-index:30;top:0}.work.show-preview aside{display:none}}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;padding:12px 6px;background:none;border:0;border-bottom:2px solid transparent;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--fg);border-bottom-color:var(--red)}
.pane{flex:1;overflow:auto;padding:16px max(14px,env(safe-area-inset-left,0px)) 80px 14px;min-height:0}
.notice{margin-bottom:14px;padding:10px 12px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.notice b{color:var(--warn)}

/* Abschnittsliste */
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;min-width:0}
.srow:hover{border-color:var(--muted)}
.srow.sel{border-color:var(--red)}
.srow.off{opacity:.5}
.srow .nm{flex:1;min-width:0;display:flex;flex-direction:column}
.srow .nm b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .tools{display:flex;gap:2px;flex:none}
.srow .tools .btn{padding:4px 6px;min-width:26px;font-size:12px}
.add-btn{width:100%;margin-top:10px;padding:14px;border-style:dashed}
.picker{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pick{text-align:left;padding:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.pick:hover{border-color:var(--red)}
.pick b{font-family:var(--display);font-stretch:75%;font-size:17px;text-transform:uppercase}
.pick span{font-size:12px;color:var(--muted)}

/* Formular */
.back{margin-bottom:12px}
.dhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.dhead h2{font-size:30px}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.flabel{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.help{font-size:12px;color:var(--muted)}
.help.ok{color:var(--ok)}.help.bad{color:var(--red-soft)}
input[type=text],input[type=url],input[type=password],input[type=number],textarea,select{font:inherit;font-size:14px;padding:8px 10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);width:100%;min-width:0;border-radius:2px}
textarea{resize:vertical;min-height:80px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--red)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.tog input{appearance:none;width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;transition:background .2s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:left .2s}
.tog input:checked{background:var(--red)}
.tog input:checked::after{left:17px}
.rng{display:flex;align-items:center;gap:10px}
.rng input{flex:1;accent-color:var(--red)}
.rng output{font-family:var(--mono);font-size:12px;min-width:44px;text-align:right}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb .src{position:absolute;left:6px;top:6px;font-family:var(--mono);font-size:10px;padding:2px 6px;background:rgba(0,0,0,.6);color:#fff}
.thumb .src.yt{background:var(--red)}
.media-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.upl{position:relative;overflow:hidden}
.upl input{position:absolute;inset:0;opacity:0;cursor:pointer}
.prog{height:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
fieldset{border:1px solid var(--line);padding:12px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
details.grp-box{border:1px solid var(--line);background:var(--panel)}
details.grp-box>summary{padding:10px 12px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
details.grp-box>summary::after{content:"+"}
details.grp-box[open]>summary::after{content:"−"}
details.grp-box>.form{padding:0 12px 12px}

/* Listen (Filme, Leistungen ...) */
.items{display:flex;flex-direction:column;gap:6px}
.item{border:1px solid var(--line);background:var(--panel)}
.item>.ih{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;cursor:pointer}
.item>.ih .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item>.ih .mini{width:44px;height:26px;object-fit:cover;flex:none;background:var(--bg)}
.item>.ib{padding:10px 12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.item .tools{display:flex;gap:2px}
.item .tools .btn{padding:3px 6px;min-width:24px;font-size:12px}

/* Fotos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.photo{background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.photo .pimg{aspect-ratio:1;overflow:hidden;position:relative}
.photo .pimg img{width:100%;height:100%;object-fit:cover}
.photo .pimg .badge{position:absolute;left:4px;top:4px;font-family:var(--mono);font-size:9px;padding:1px 4px;background:var(--red);color:#fff}
.photo .pctl{padding:4px;display:flex;flex-direction:column;gap:4px}
.photo .pctl input{font-size:11px;padding:4px 6px}
.photo .row{display:flex;gap:2px;flex-wrap:wrap}
.photo .row .btn{padding:2px 5px;font-size:10px;min-width:0;flex:1}
.addph{border:1px dashed var(--line);display:grid;place-items:center;text-align:center;min-height:120px;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:8px;cursor:pointer}
.addph:hover{border-color:var(--red);color:var(--fg)}

/* Design */
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.preset{display:flex;flex-direction:column;gap:6px;padding:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left}
.preset:hover{border-color:var(--red)}
.preset .sw{display:flex;height:18px}
.preset .sw i{flex:1}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.color{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:4px 6px 4px 4px;background:var(--bg)}
.color input[type=color]{width:30px;height:30px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.color div{display:flex;flex-direction:column;min-width:0}
.color input[type=text]{border:0;padding:0;font-family:var(--mono);font-size:12px;background:none}
.fontsample{font-size:26px;line-height:1.1;padding:10px;border:1px solid var(--line);background:var(--bg);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* Vorschau */
.preview-pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#08090a}
.pbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
.pbar .mono{margin-right:auto}
.pstage{flex:1;display:flex;justify-content:center;overflow:auto;min-height:0;padding:0}
.pstage iframe{border:0;width:100%;height:100%;background:var(--bg);transition:width .3s}
.pstage.dev-tab iframe{width:820px;max-width:100%;border-inline:1px solid var(--line)}
.pstage.dev-mob iframe{width:390px;max-width:100%;border-inline:1px solid var(--line)}
.close-prev{display:none}
@media (max-width:1000px){.close-prev{display:inline-flex}}
.mob-prev{display:none}
@media (max-width:1000px){.mob-prev{display:inline-flex}.work:not(.show-preview) .preview-pane{display:none}.pbar .mono{display:none}.pbar{justify-content:space-between}}

/* Login */
.gate{flex:1;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate form{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);padding:24px;display:flex;flex-direction:column;gap:12px}
.gate h1{font-size:44px}
.gate .err{color:var(--red-soft);min-height:1.4em;margin:0;font-size:14px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;z-index:40;max-width:calc(100% - 32px)}
.toast.err{border-color:var(--red);color:var(--red-soft)}

/* ---- Vereinfachte Oberfläche ---- */
.btn.small{padding:6px 10px;font-size:10.5px}
.helpcard{border:1px solid color-mix(in srgb,var(--red) 40%,var(--line));background:color-mix(in srgb,var(--red) 7%,var(--panel));padding:14px 14px 12px;margin-bottom:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.helpcard ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.grip{cursor:grab;color:var(--muted);font-size:13px;letter-spacing:-2px;padding:4px 6px;user-select:none;flex:none}
.grip:active{cursor:grabbing}
.slist{gap:4px}
.srow{position:relative;padding:10px 8px 10px 4px;gap:6px}
.srow .sicon,.pick .sicon{width:30px;height:30px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font-size:14px;flex:none;color:var(--fg)}
.srow .nm{gap:2px}
.srow .nm b{font-size:14px}
.srow .nm .mono{font-size:10px}
.eye{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;padding:6px;display:inline-flex;align-items:center;gap:6px;border-radius:2px}
.eye:hover{color:var(--fg);border-color:var(--line)}
.eye.big{border-color:var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px}
.ins{position:absolute;left:50%;top:-11px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;border:1px solid var(--red);background:var(--bg);color:var(--red);font-size:14px;line-height:1;cursor:pointer;opacity:0;transition:opacity .15s;z-index:2;padding:0}
.srow:hover .ins,.ins:focus-visible{opacity:1}
.srow:first-child .ins{top:-9px}
.dragging{opacity:.4}
.drop-before{box-shadow:0 -2px 0 var(--red)}
.drop-after{box-shadow:0 2px 0 var(--red)}
.photo.drop-before{box-shadow:-3px 0 0 var(--red)}
.photo.drop-after{box-shadow:3px 0 0 var(--red)}
.crumb{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dhead h2{font-size:28px;word-break:break-word}
.grp-box{border:1px solid var(--line);background:var(--panel);margin-bottom:8px}
.grp-box>summary{padding:12px 14px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.grp-box>summary::-webkit-details-marker{display:none}
.grp-box>summary::after{content:"+";font-family:var(--mono);color:var(--muted);font-size:16px}
.grp-box[open]>summary::after{content:"−"}
.grp-box>.gbody{padding:4px 14px 16px}
details.more{border-top:1px dashed var(--line);padding-top:8px}
details.more>summary{cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);list-style:none;padding:4px 0}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ "}
details.more[open]>summary::before{content:"▾ "}
details.more>.form{margin-top:10px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);background:var(--bg);width:fit-content;max-width:100%}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:7px 11px;font-size:12.5px;color:var(--muted);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg)}
.seg button.on{background:var(--fg);color:var(--bg)}
.item{border:1px solid var(--line);background:var(--bg)}
.item.open{border-color:var(--muted)}
.item>.ih{padding:6px 8px 6px 2px}
.item>.ih .nm b{font-weight:500}
.item>.ih .nm small{color:var(--muted)}
.item>.ih .chev{font-family:var(--mono);color:var(--muted);padding:0 4px}
.item>.ib{background:var(--panel)}
.itools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);padding-top:10px}
.add-item{border-style:dashed;align-self:flex-start;margin-top:4px}
.eicon{width:24px;height:24px;display:grid;place-items:center;border:1px solid var(--line);font-family:var(--mono);font-size:12px;flex:none;color:var(--red-soft)}
.wtag{font-size:10px}
.epick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.etile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:12px;text-align:center}
.etile:hover{border-color:var(--red)}
.etile .eicon{width:30px;height:30px;font-size:15px}
.ph3{font-size:15px;font-stretch:75%;margin:18px 0 8px;color:var(--muted)}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.qtile{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left;font-size:13px}
.qtile:hover{border-color:var(--red)}
.qicon{width:36px;height:30px;display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--red-soft);flex:none}
.pick{flex-direction:row;align-items:flex-start;gap:10px}
.pick>span:last-child{display:flex;flex-direction:column;gap:2px}
.imgdrop{position:relative;display:grid;place-items:center;aspect-ratio:16/9;max-width:100%;border:1px dashed var(--line);background:var(--bg);cursor:pointer;overflow:hidden}
.imgdrop.has{border-style:solid}
.imgdrop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.imgdrop .swap{position:absolute;inset:auto 0 0 0;padding:6px;background:rgba(0,0,0,.65);color:#fff;text-align:center;opacity:0;transition:opacity .2s}
.imgdrop:hover .swap{opacity:1}
.imgdrop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.imgdrop.over,.photos.over{outline:2px solid var(--red);outline-offset:2px}
.photos{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.photo .pimg{cursor:grab}
.photo .pctl{flex-direction:row;gap:2px;padding:3px}
.pbtn{flex:1;background:none;border:1px solid var(--line);color:var(--fg);font-size:11px;padding:3px 0;cursor:pointer}
.pbtn.on{background:var(--fg);color:var(--bg)}
.pbtn.danger{color:var(--red-soft)}
.palt{font-size:11px!important;padding:4px 6px!important;border-width:1px 0 0!important}
.preset{position:relative}
.preset .sw{height:30px;display:flex;align-items:flex-end;justify-content:flex-end;gap:4px;padding:4px;border:1px solid var(--line)}
.preset .sw i{flex:none;width:12px;height:12px;border-radius:50%}
.preset.on{border-color:var(--red)}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--red),0 0 0 6px color-mix(in srgb,var(--red) 25%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
.rich{font-size:14px;line-height:1.5;padding:8px 10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);min-height:36px;border-radius:2px;outline:none;overflow-wrap:anywhere}
.rich.ml{min-height:80px}
.rich p{margin:0 0 .6em}.rich p:last-child{margin:0}
.rich:focus{border-color:var(--red)}
.rich.empty::before{content:attr(data-ph);color:var(--muted)}
.rich a{color:var(--red-soft)}
.rich [class*=ta-]{border-bottom:1px dotted var(--red-soft)}
.field .hint{display:none}
.rich:focus + .hint{display:block}
.swatches{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.swatch{width:24px;height:24px;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0;border-radius:4px;position:relative;display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--muted);background:var(--bg)}
.swatch.on{outline:2px solid var(--fg);outline-offset:2px}
.swatch.none{width:auto;padding:0 6px}
.swatch.pick{font-size:14px;color:var(--fg)}
.swatch.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.btnfield{border:1px solid var(--line);padding:10px;background:var(--bg);gap:10px}
.bfhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;padding:2px 5px;background:#5b8cff;color:#fff;border-radius:2px;flex:none}
.help.warn{color:var(--warn)}
input[type=date]{font:inherit;font-size:14px;padding:8px 10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:2px;color-scheme:dark}
.actbox{display:flex;flex-direction:column;gap:6px}
.actbox .sum{line-height:1.35}
.sharecard{display:flex;flex-direction:column;border:1px solid var(--line);background:#1f2c33;border-radius:8px;overflow:hidden;max-width:360px}
.sharecard .sc-img{aspect-ratio:1200/630;background-size:cover;background-position:center}
.sharecard .sc-txt{padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:#cfd6da}
.sharecard .sc-txt b{color:#fff;font-size:13.5px}
.sharecard .sc-host{font-size:11px;color:#8fa3ad;text-transform:lowercase}
.inq{border:1px solid var(--line);background:var(--panel);padding:12px 14px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px}
.inq.unread{border-left:3px solid var(--red)}
.inq .ih2{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.inq .ih2 b{font-size:15px}
.inq dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13px}
.inq dt{color:var(--muted)}.inq dd{margin:0;overflow-wrap:anywhere}
.inq .msg{white-space:pre-wrap;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
#inboxCount:not(:empty){background:var(--red);color:#fff;border-radius:9px;padding:1px 6px;font-size:10px;margin-left:2px}
#pubBtn.has{box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 35%,transparent)}
#pubBtn:disabled{background:var(--panel2);border-color:var(--line);color:var(--muted);opacity:1}
.vers{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.meter{display:block;height:6px;background:var(--line);margin-bottom:8px}
.meter i{display:block;height:100%;background:var(--red)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <form id="gateForm">
    <span class="mono">Website · Editor</span>
    <h1>Anmelden</h1>
    <p class="mono" id="gateHint">Passwort eingeben.</p>
    <input id="gatePw" type="password" autocomplete="current-password" aria-label="Passwort" required>
    <p class="err" id="gateErr" role="alert"></p>
    <button class="btn primary" type="submit">Anmelden</button>
    <a class="btn" href="index.html">← Zur Website</a>
  </form>
</div>

<header class="bar" id="bar" hidden>
  <div class="title"><i></i><b>Website-Editor</b></div>
  <span class="status" id="status">Geladen</span>
  <div class="grp">
    <button class="btn icon" type="button" id="undoBtn" title="Rückgängig (⌘Z)" aria-label="Rückgängig" disabled>↶</button>
    <button class="btn icon" type="button" id="redoBtn" title="Wiederholen (⇧⌘Z)" aria-label="Wiederholen" disabled>↷</button>
  </div>
  <span class="sep hide-m"></span>
  <button class="btn mob-prev" type="button" id="mobPrev">Vorschau</button>
  <a class="btn hide-m" href="index.html" id="viewBtn">Website ansehen ↗</a>
  <button class="btn" type="button" id="saveBtn" hidden>Entwurf speichern</button>
  <button class="btn ghost danger" type="button" id="discardBtn" hidden>Verwerfen</button>
  <button class="btn primary" type="button" id="pubBtn" disabled>Veröffentlichen</button>
</header>

<div class="work" id="work" hidden>
  <aside>
    <div class="tabs" role="tablist">
      <button type="button" class="on" data-tab="page" role="tab">Seite</button>
      <button type="button" data-tab="design" role="tab">Design</button>
      <button type="button" data-tab="inbox" role="tab">Anfragen <span id="inboxCount"></span></button>
      <button type="button" data-tab="settings" role="tab">Einstellungen</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
  <div class="preview-pane">
    <div class="pbar">
      <span class="mono">Live-Vorschau · Klick auf einen Abschnitt zum Bearbeiten</span>
      <div class="grp" id="devBtns">
        <button class="btn icon on" type="button" data-dev="" title="Computer">▭</button>
        <button class="btn icon" type="button" data-dev="dev-tab" title="Tablet">▯</button>
        <button class="btn icon" type="button" data-dev="dev-mob" title="Handy">▮</button>
      </div>
      <button class="btn close-prev" type="button" id="closePrev">Zurück zum Editor</button>
    </div>
    <div class="pstage" id="pstage"><iframe id="frame" title="Live-Vorschau der Website" src="about:blank"></iframe></div>
  </div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="sections.js"></script>
<script src="richtext.js"></script>
<script src="api.js"></script>
<script src="editor.js"></script>
</body>
</html>
